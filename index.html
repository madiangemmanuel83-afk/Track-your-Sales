<style>
:root{--bg:#fbf6ea;--card:#fff;--ink:#1d2a1f;--mute:#6b7466;--g:#1b5e20;--gl:#e3f1e2;--t:#c4521f;--tl:#fbe3d6;--line:#e3dcc8;--am:#b26a00;--aml:#fff0cf;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141b15;--card:#1d271e;--ink:#eef2e8;--mute:#9aa593;--g:#6fcf76;--gl:#25382a;--t:#ff8a57;--tl:#3a2417;--line:#2e3b2f;--am:#ffc04d;--aml:#3a2e12}}
:root[data-theme="dark"]{--bg:#141b15;--card:#1d271e;--ink:#eef2e8;--mute:#9aa593;--g:#6fcf76;--gl:#25382a;--t:#ff8a57;--tl:#3a2417;--line:#2e3b2f;--am:#ffc04d;--aml:#3a2e12}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 'DM Sans',system-ui,sans-serif}
.w{max-width:960px;margin:0 auto;padding:0 16px 16px}
h1{font:800 28px 'Fraunces',Georgia,serif;margin:0;color:var(--g)}h2{font:600 18px 'Fraunces',Georgia,serif;margin:22px 0 8px}
.sub{color:var(--mute);font-size:13px}.top{display:flex;justify-content:space-between;align-items:end;gap:8px;flex-wrap:wrap}
.top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:10;padding:10px 0}
nav{position:fixed;left:0;right:0;bottom:0;z-index:15;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;border:0;background:none;color:var(--mute);font:600 11px inherit;font-family:inherit;padding:4px;cursor:pointer}
nav button span{font-size:21px;line-height:1.1}nav button.on{color:var(--g)}nav button.on span{transform:scale(1.15)}
.fab{position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:var(--t);color:#fff;font-size:32px;line-height:1;border:0;box-shadow:0 4px 14px rgba(0,0,0,.35);z-index:15;cursor:pointer}
.sheet{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;align-items:flex-end}.sheet.open{display:flex}
.sheet .card{width:100%;max-width:640px;margin:0 auto;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
body{-webkit-tap-highlight-color:transparent;padding-bottom:120px;overscroll-behavior-y:contain}button{touch-action:manipulation}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kp div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}.kp b{display:block;font:800 22px 'Fraunces',Georgia,serif}.kp span{font-size:12px;color:var(--mute)}
.kp .net{background:var(--g);color:var(--bg)}.kp .net span{color:var(--bg);opacity:.85}.kp .owe b{color:var(--t)}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
label{font-size:12px;color:var(--mute);display:flex;flex-direction:column;gap:2px}
input,select{padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;width:100%}
.btn{padding:10px 14px;border:0;border-radius:10px;background:var(--t);color:#fff;font:700 14px inherit;font-family:inherit;cursor:pointer;align-self:end}
.btn.s{background:var(--card);color:var(--ink);border:1px solid var(--line)}.btn.sm{padding:5px 9px;font-size:12px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;color:var(--mute);font-weight:500;padding:6px;border-bottom:2px solid var(--line);white-space:nowrap}td{padding:7px 6px;border-bottom:1px solid var(--line);white-space:nowrap}td.n,th.n{text-align:right}
.chip{padding:2px 8px;border-radius:99px;font-size:12px;font-weight:700}.Paid{background:var(--gl);color:var(--g)}.Partial{background:var(--aml);color:var(--am)}.Unpaid{background:var(--tl);color:var(--t)}
.bars{display:flex;gap:4px;align-items:end;height:140px;margin-top:8px}.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:end;height:100%;font-size:10px;color:var(--mute)}
.bars i{display:flex;gap:2px;align-items:end;width:100%;height:100%}.bars em{flex:1;border-radius:3px 3px 0 0;min-height:1px}.bars .a{background:var(--g)}.bars .b{background:var(--t)}
.lg{font-size:12px;color:var(--mute)}.lg u{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 4px 0 8px;text-decoration:none}
.empty{color:var(--mute);padding:14px;text-align:center}.hide{display:none}
@media(min-width:900px){
 nav{top:0;bottom:auto;right:auto;width:210px;height:100%;flex-direction:column;justify-content:flex-start;gap:4px;padding:10px;border-top:0;border-right:1px solid var(--line)}
 nav::before{content:"\1F4C8  Sales Tracker";font:800 19px 'Fraunces',Georgia,serif;color:var(--g);padding:16px 10px 18px}
 nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:10px;padding:12px 14px;font-size:14px;border-radius:10px}
 nav button span{font-size:18px}nav button.on span{transform:none}nav button.on{background:var(--gl)}
 .w{max-width:1200px;margin:0 0 0 210px;padding:0 32px 32px}body{padding-bottom:40px}
 .top h1{font-size:24px}
 .fab{bottom:28px;right:32px;width:auto;height:50px;border-radius:25px;padding:0 22px;font-size:26px;display:flex;align-items:center;gap:6px}
 .fab::after{content:"Add";font:700 15px 'DM Sans',system-ui,sans-serif}
 .sheet{align-items:center;justify-content:center}.sheet .card{border-radius:18px;max-width:560px;margin:0;padding-bottom:18px}
 .kp{grid-template-columns:repeat(6,1fr)}
 table{font-size:14px}th,td{padding:9px 8px}
}
@media(min-width:1200px){.w{margin-left:max(210px,calc(50% - 390px))}}
</style></head><body><div class="w">
<div class="top"><div><h1 style="font-size:22px">Sales Tracker</h1><div class="sub" id="st">Starting…</div></div>
<select id="yr" style="width:auto"></select></div>
<nav id="nav"><button data-t="dash" class="on"><span>🏠</span>Home</button><button data-t="sales"><span>🧾</span>Sales</button><button data-t="exp"><span>💸</span>Expenses</button><button data-t="set"><span>⚙️</span>Setup</button></nav><button class="fab" id="fab" aria-label="Add">+</button>

<section id="dash"></section>

<section id="sales" class="hide">
<div class="sheet" id="shs"><div class="card"><h2 style="margin-top:0" id="sht">New sale</h2><form id="fs">
<label>Date<input type="date" id="sd" required></label>
<label>Product / service<input id="sp" list="pl" required></label><datalist id="pl"></datalist>
<label>Qty<input type="number" id="sq" min="0" step="any" value="1" required></label>
<label>Unit price (KSh)<input type="number" id="su" min="0" step="any" required></label>
<label>Unit cost (KSh)<input type="number" id="sk" min="0" step="any" value="0"></label>
<label>Paid via<select id="sm"><option>M-Pesa</option><option>Cash</option><option>Bank</option><option>Pay Later</option></select></label>
<label>Amount paid (KSh)<input type="number" id="sa" min="0" step="any" placeholder="blank = full"></label>
<button class="btn" id="sb">Add sale</button><button type="button" class="btn s hide" id="sx">Cancel edit</button></form></div></div>
<h2>Sales log</h2><div class="card tw" id="sl"></div></section>

<section id="exp" class="hide">
<div class="sheet" id="she"><div class="card"><h2 style="margin-top:0" id="eht">New expense</h2><form id="fe">
<label>Date<input type="date" id="ed" required></label>
<label>Category<select id="ec"><option>Transport</option><option>Airtime &amp; Data</option><option>Rent</option><option>Packaging</option><option>Advertising</option><option>Licences &amp; Fees</option><option>Utilities</option><option>Other</option></select></label>
<label>Description<input id="ex"></label>
<label>Amount (KSh)<input type="number" id="ea" min="0" step="any" required></label>
<button class="btn" id="eb">Add expense</button><button type="button" class="btn s hide" id="ex2">Cancel edit</button></form>
<p class="sub">Don't log stock you resell here. Unit cost on each sale already covers it.</p></div></div>
<h2>Expense log</h2><div class="card tw" id="el"></div></section>

<section id="set" class="hide">
<div class="card"><h2 style="margin-top:0">My products / services</h2>
<form id="fp" style="grid-template-columns:1fr auto"><input id="np" placeholder="Add a product or service"><button class="btn">Add</button></form>
<div id="pls" style="margin-top:10px"></div></div>
<h2>Account &amp; sync</h2><div class="card" id="acct"></div>
<h2>Your data</h2><div class="card">
<button class="btn s" id="exs">Download sales (CSV)</button> <button class="btn s" id="exe">Download expenses (CSV)</button> <button class="btn s" id="bk">Backup (file)</button> <button class="btn s" id="rs">Restore backup</button><input type="file" id="rf" accept=".json" class="hide"> <button class="btn s" id="rst" style="color:var(--t)">Erase everything</button></div></section>
<p class="sub" style="margin-top:24px">Profit = price − unit cost. Net profit = profit − expenses. Money owed counts all sales, all years.</p>
</div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const KEY='salesTrackerKE3',CFG=window.CFG||{};
const fresh=()=>({s:{},e:{},p:{},q:[],lastPull:null,shop:null,role:'',uid:null});
let S=fresh(),sb=null,sess=null,me=null,names={},busy=false,cur='dash',yr=new Date().getFullYear(),aKey='',syncErr='';
const today=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};
const fmt=n=>'KSh '+Math.round(n||0).toLocaleString('en-KE');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const tot=x=>x.q*x.u,prof=x=>x.q*(x.u-x.k),paid=x=>x.a==null?tot(x):x.a,bal=x=>Math.max(0,tot(x)-paid(x));
const status=x=>bal(x)<=0?'Paid':paid(x)>0?'Partial':'Unpaid';
const L=k=>Object.values(S[k]);
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const pend=(k,id)=>S.q.some(o=>o.k==k&&o.id==id);
function queue(k,id,op){S.q=S.q.filter(o=>!(o.k==k&&o.id==id));S.q.push({k,id,op})}
function add(k,r){r.by=r.by||me;r.t=r.t||Date.now();S[k][r.id]=r;queue(k,r.id,'set')}
function put(k,r){r.t=Date.now();add(k,r);commit()}
function del(k,id){delete S[k][id];queue(k,id,'del');commit()}
function commit(){persist();render();flush()}
const who=x=>!x.by?'\u2014':x.by==me?'You':(names[x.by]||'Team');
function status_(){const n=S.q.length,el=$('st');
 if(!sb)el.textContent='Saved on this device (cloud sync not set up)';
 else if(!sess)el.textContent='Saved on this device. Sign in (Setup) to sync and share';
 else if(!S.shop)el.textContent='Signed in. Create or join a shop (Setup) to sync';
 else if(!navigator.onLine)el.textContent=n?`Offline: ${n} change${n>1?'s':''} saved, will sync when online`:'Offline: changes will sync when online';
 else if(syncErr)el.textContent='Sync problem: '+syncErr+' (will retry)';
 else el.textContent=n?`Syncing ${n} change${n>1?'s':''}\u2026`:'Synced \u2713';
 acct_()}
const msg=t=>{const m=$('am');if(m)m.textContent=t};
function acct_(){const k=[!!sb,!!sess,S.shop&&S.shop.id,S.role].join('|');
 if(k!=aKey){aKey=k;let h='';
  if(!sb)h='<p class=sub style="margin:0">Cloud sync is not set up yet. The app works fully on this device. To turn on sign-in and sharing, follow README step 1 and fill in config.js.</p>';
  else if(!sess)h='<p class=sub style="margin-top:0">Sign in with your email to keep your data online, use it on all your devices and let people who sell for you add sales from their phones. The app keeps working offline; anything recorded offline is sent automatically once the device is back online.</p><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px"><label>Email<input id=ae type=email autocomplete=username></label><label>Password<input id=ap type=password autocomplete=current-password></label><button type=button class=btn onclick="doIn()">Sign in</button><button type=button class="btn s" onclick="doUp()">Create account</button></div><p style="margin:10px 0 0"><a href="#" class=sub onclick="doForgot();return false">Forgot password?</a></p><p class=sub id=am></p>';
  else if(!S.shop)h='<p style="margin-top:0">Signed in as <b>'+esc(sess.user.email)+'</b>. Choose one:</p><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px"><div class=card><b>I own the shop</b><p class=sub>Creates a shop and gives you a code to share.</p><input id=sn2 placeholder="Shop name (optional)"><br><br><button type=button class=btn onclick="doCreate()">Create my shop</button></div><div class=card><b>I work in someone\u2019s shop</b><p class=sub>Type the code the owner gave you.</p><input id=jc placeholder="Shop code" style="text-transform:uppercase"><br><br><button type=button class=btn onclick="doJoin()">Join shop</button></div></div><p class=sub id=am></p>';
  else h='<p style="margin:0">Signed in as <b>'+esc(sess.user.email)+'</b> \u00b7 '+(S.role=='owner'?'Owner':'Team member')+'</p><p>Shop: <b>'+esc(S.shop.name)+'</b> \u00b7 Shop code: <b style="font:800 20px Fraunces,Georgia,serif;letter-spacing:2px">'+esc(S.shop.code)+'</b></p><p class=sub>Give this code to the person who sells for you. They create their own account, choose \u201cI work in someone\u2019s shop\u201d and type the code. Both phones then see the same sales.</p><div id=tm></div><p class=sub id=am></p><button type=button class="btn s" onclick="flush()">Sync now</button> <button type=button class="btn s" onclick="doOut()">Sign out</button>';
  $('acct').innerHTML=h}
 const tm=$('tm');if(tm){const c={};[...L('s'),...L('e')].forEach(x=>{const k=x.by||'';c[k]=(c[k]||0)+1});
  tm.innerHTML='<div class=sub style="margin-bottom:4px">People in this shop:</div>'+Object.entries(names).map(([i,n])=>`<div>${i==me?'You':esc(n)} <span class=sub>\u00b7 ${c[i]||0} entr${c[i]==1?'y':'ies'}</span></div>`).join('')}
 $('rst').classList.toggle('hide',!!(sess&&S.shop&&S.role!='owner'))}
window.doIn=async()=>{msg('Signing in\u2026');const{error}=await sb.auth.signInWithPassword({email:$('ae').value.trim(),password:$('ap').value});msg(error?error.message:'')};
window.doUp=async()=>{const e=$('ae').value.trim(),p=$('ap').value;if(!e||p.length<6)return msg('Enter your email and a password of at least 6 characters.');msg('Creating account\u2026');const{data,error}=await sb.auth.signUp({email:e,password:p});if(error)return msg(error.message);msg(data.session?'':'Account created. Check your email to confirm it, then sign in.')};
window.doForgot=async()=>{const e=$('ae').value.trim();if(!e)return msg('Type your email first.');const{error}=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.origin+location.pathname});msg(error?error.message:'Reset link sent. Check your email.')};
window.doOut=async()=>{if(S.q.length&&!confirm(`${S.q.length} change(s) have not synced yet and will be lost if you sign out. Sign out anyway?`))return;await sb.auth.signOut();S=fresh();names={};persist();render()};
const setShop=(r,role)=>{r=Array.isArray(r)?r[0]:r;S.shop={id:r.id,name:r.name,code:r.code};S.role=role;S.uid=me;persist();afterAuth()};
window.doCreate=async()=>{msg('Creating\u2026');const{data,error}=await sb.rpc('create_shop',{p_name:$('sn2').value.trim()||'My shop'});if(error)return msg(error.message);setShop(data,'owner')};
window.doJoin=async()=>{const c=$('jc').value.trim();if(!c)return msg('Type the shop code.');msg('Joining\u2026');const{data,error}=await sb.rpc('join_shop',{p_code:c});if(error)return msg(error.message);setShop(data,'member')};
async function team(){const{data}=await sb.from('members').select('user_id,display').eq('shop_id',S.shop.id);(data||[]).forEach(m=>names[m.user_id]=m.display||'Team member')}
async function afterAuth(){if(!sess||!navigator.onLine)return status_();
 try{if(S.uid&&S.uid!==me){S=fresh();persist()}
  if(!S.shop){const{data}=await sb.from('members').select('role,shops(id,name,code)').eq('user_id',me).limit(1);
   if(data&&data[0]&&data[0].shops){S.shop=data[0].shops;S.role=data[0].role;S.uid=me;persist()}}
  if(S.shop)await team()
 }catch(e){}
 status_();render();if(S.shop)flush()}
async function pull(){let n;do{let q=sb.from('records').select('id,kind,data,deleted,updated_at,by').eq('shop_id',S.shop.id).order('updated_at',{ascending:true}).limit(1000);
 if(S.lastPull)q=q.gte('updated_at',S.lastPull);const{data,error}=await q;if(error)throw error;n=data.length;
 data.forEach(r=>{S.lastPull=r.updated_at;if(!S[r.kind]||pend(r.kind,r.id))return;if(r.deleted)delete S[r.kind][r.id];else S[r.kind][r.id]=Object.assign({},r.data,{id:r.id,by:r.by})});
 }while(n>=1000);if([...L('s'),...L('e')].some(x=>x.by&&!names[x.by]))await team();persist();render()}
async function flush(){if(busy||!sb||!sess||!S.shop||!navigator.onLine)return status_();busy=true;
 try{const ops=[...S.q];
  if(ops.length){const rows=ops.map(o=>{const r=S[o.k][o.id],gone=o.op=='del'||!r;return{id:o.id,shop_id:S.shop.id,kind:o.k,data:gone?{}:r,deleted:gone,by:(r&&r.by)||me}});
   const{error}=await sb.from('records').upsert(rows,{onConflict:'shop_id,id'});if(error)throw error;
   S.q=S.q.filter(x=>!ops.includes(x));persist()}
  await pull();syncErr=''}catch(e){syncErr=(e&&(e.message||e.details))||'unknown error'}
 busy=false;status_()}
const ym=d=>[+d.slice(0,4),+d.slice(5,7)-1];
let allWeeks=false;
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function weekKey(d){const t=new Date(d+'T00:00:00Z');t.setUTCDate(t.getUTCDate()-((t.getUTCDay()+6)%7));return t.toISOString().slice(0,10)}
function wlabel(w){const a=new Date(w+'T00:00:00Z'),b=new Date(a.getTime()+6*864e5);return a.getUTCDate()+' '+MON[a.getUTCMonth()]+' \u2013 '+b.getUTCDate()+' '+MON[b.getUTCMonth()]}
window.toggleWeeks=()=>{allWeeks=!allWeeks;render()};
function render(){
 const A=L('s'),B=L('e'),yrs=new Set([new Date().getFullYear(),yr]);[...A,...B].forEach(x=>yrs.add(+x.d.slice(0,4)));
 $('yr').innerHTML=[...yrs].sort().map(y=>`<option ${y==yr?'selected':''}>${y}</option>`).join('');
 const ss=A.filter(x=>+x.d.slice(0,4)==yr),ee=B.filter(x=>+x.d.slice(0,4)==yr),sum=(a,f)=>a.reduce((t,x)=>t+f(x),0);
 const T=sum(ss,tot),P=sum(ss,prof),X=sum(ee,x=>x.a),owed=sum(A,bal);
 const m=Array.from({length:12},()=>({s:0,e:0}));ss.forEach(x=>m[ym(x.d)[1]].s+=tot(x));ee.forEach(x=>m[ym(x.d)[1]].e+=x.a);
 const mx=Math.max(1,...m.map(z=>Math.max(z.s,z.e))),mn='JFMAMJJASOND';
 const by={};ss.forEach(x=>{const k=x.p;by[k]=by[k]||{s:0,p:0,n:0};by[k].s+=tot(x);by[k].p+=prof(x);by[k].n+=x.q});
 const rows=Object.entries(by).sort((a,b)=>b[1].p-a[1].p).map(([k,v])=>`<tr><td>${esc(k)}</td><td class=n>${fmt(v.s)}</td><td class=n>${fmt(v.p)}</td><td class=n>${v.n}</td></tr>`).join('');
 const dues=A.filter(x=>bal(x)>0).sort((a,b)=>a.d.localeCompare(b.d)).map(x=>`<tr><td>${x.d}</td><td>${esc(x.p)}</td><td class=n>${fmt(bal(x))}</td><td><button class="btn sm s" onclick="settle('${x.id}')">Mark paid</button></td></tr>`).join('');
 const wk=weekKey(today()),tw=A.filter(x=>weekKey(x.d)==wk).reduce((t,x)=>t+tot(x),0),W={};
 const wadd=(x,k,v)=>{const w=weekKey(x.d);W[w]=W[w]||{s:0,p:0,e:0,n:0};W[w][k]+=v};
 ss.forEach(x=>{wadd(x,'s',tot(x));wadd(x,'p',prof(x));W[weekKey(x.d)].n++});ee.forEach(x=>wadd(x,'e',x.a));
 const wl=Object.keys(W).sort().reverse(),shown=allWeeks?wl:wl.slice(0,8);
 const wrows=shown.map(w=>{const z=W[w];return`<tr${w==wk?' style="font-weight:700"':''}><td>${wlabel(w)}${w==wk?' (this week)':''}</td><td class=n>${fmt(z.s)}</td><td class=n>${fmt(z.p)}</td><td class=n>${fmt(z.e)}</td><td class=n>${fmt(z.p-z.e)}</td><td class=n>${z.n}</td></tr>`}).join('');
 const weeklyHtml=`<h2>Weekly totals <span class=sub>(Monday to Sunday)</span></h2><div class="card tw">${wl.length?`<table><tr><th>Week</th><th class=n>Sales</th><th class=n>Profit</th><th class=n>Expenses</th><th class=n>Net</th><th class=n>Sales made</th></tr>${wrows}</table>${wl.length>8?`<p style="margin:10px 0 0"><button class="btn sm s" onclick="toggleWeeks()">${allWeeks?'Show recent weeks':'Show all weeks'}</button></p>`:''}`:'<div class=empty>Weekly totals appear once you add sales.</div>'}</div>`;
 $('dash').innerHTML=`<div class=kp><div><b>${fmt(T)}</b><span>Sales ${yr}</span></div><div><b>${fmt(P)}</b><span>Gross profit</span></div><div><b>${fmt(X)}</b><span>Expenses</span></div><div class=net><b>${fmt(P-X)}</b><span>NET PROFIT</span></div><div class=owe><b>${fmt(owed)}</b><span>Owed to you</span></div><div><b>${ss.length}</b><span>Sales made</span></div><div><b>${fmt(tw)}</b><span>Sales this week</span></div></div>
 <h2>Month by month</h2><div class=card><span class=lg><u style="background:var(--g)"></u>Sales<u style="background:var(--t)"></u>Expenses</span><div class=bars>${m.map((z,i)=>`<div><i><em class=a style="height:${z.s/mx*100}%" title="${fmt(z.s)}"></em><em class=b style="height:${z.e/mx*100}%" title="${fmt(z.e)}"></em></i>${mn[i]}</div>`).join('')}</div></div>
 ${weeklyHtml}
 <h2>Best products (by profit)</h2><div class="card tw">${rows?`<table><tr><th>Product</th><th class=n>Sales</th><th class=n>Profit</th><th class=n>Units</th></tr>${rows}</table>`:'<div class=empty>Add your first sale to see this.</div>'}</div>
 <h2>Unpaid balances</h2><div class="card tw">${dues?`<table><tr><th>Date</th><th>Item</th><th class=n>Balance</th><th></th></tr>${dues}</table>`:'<div class=empty>No unpaid balances.</div>'}</div>`;
 const so=[...A].sort((a,b)=>b.d.localeCompare(a.d)||b.t-a.t);
 $('sl').innerHTML=so.length?`<table><tr><th>Date</th><th>Item</th><th class=n>Qty</th><th class=n>Total</th><th class=n>Profit</th><th>Via</th><th class=n>Balance</th><th>Status</th><th>By</th><th></th></tr>${so.map(x=>`<tr><td>${x.d}</td><td>${esc(x.p)}</td><td class=n>${x.q}</td><td class=n>${fmt(tot(x))}</td><td class=n>${fmt(prof(x))}</td><td>${esc(x.m)}</td><td class=n>${fmt(bal(x))}</td><td><span class="chip ${status(x)}">${status(x)}</span></td><td>${esc(who(x))}${pend('s',x.id)?' ⏳':''}</td><td style="white-space:nowrap"><button class="btn sm s" onclick="editS('${x.id}')">Edit</button> <button class="btn sm s" onclick="delS('${x.id}')">✕</button></td></tr>`).join('')}</table>`:'<div class=empty>No sales yet.</div>';
 const eo=[...B].sort((a,b)=>b.d.localeCompare(a.d)||b.t-a.t);
 $('el').innerHTML=eo.length?`<table><tr><th>Date</th><th>Category</th><th>Description</th><th class=n>Amount</th><th>By</th><th></th></tr>${eo.map(x=>`<tr><td>${x.d}</td><td>${esc(x.c)}</td><td>${esc(x.n)}</td><td class=n>${fmt(x.a)}</td><td>${esc(who(x))}${pend('e',x.id)?' ⏳':''}</td><td style="white-space:nowrap"><button class="btn sm s" onclick="editE('${x.id}')">Edit</button> <button class="btn sm s" onclick="delE('${x.id}')">✕</button></td></tr>`).join('')}</table>`:'<div class=empty>No expenses yet.</div>';
 $('pl').innerHTML=[...new Set([...L('p').map(p=>p.name),...A.map(x=>x.p)])].sort().map(p=>`<option value="${esc(p)}">`).join('');
 $('pls').innerHTML=L('p').sort((a,b)=>a.name.localeCompare(b.name)).map(p=>`<span class="chip Paid" style="display:inline-block;margin:0 6px 6px 0">${esc(p.name)} <a href="#" onclick="delP('${p.id}');return false" style="color:inherit">✕</a></span>`).join('')||'<span class=sub>None yet. Products also get added automatically when you log a sale.</span>';
 status_()}
window.settle=id=>{const x=S.s[id];if(x){x.a=tot(x);put('s',x)}};
window.delS=id=>{if(confirm('Delete this sale?'))del('s',id)};
window.delE=id=>{if(confirm('Delete this expense?'))del('e',id)};
let eS=null,eE=null;
function openSheet(k){$(k=='s'?'shs':'she').classList.add('open')}
function closeSheets(){$('shs').classList.remove('open');$('she').classList.remove('open')}
function resetS(){$('sht').textContent='New sale';eS=null;$('sb').textContent='Add sale';$('sx').classList.add('hide');$('fs').reset();$('sd').value=today();$('sq').value=1;$('sk').value=0}
function resetE(){$('eht').textContent='New expense';eE=null;$('eb').textContent='Add expense';$('ex2').classList.add('hide');$('fe').reset();$('ed').value=today()}
window.editS=id=>{const x=S.s[id];if(!x)return;eS=id;$('sd').value=x.d;$('sp').value=x.p;$('sq').value=x.q;$('su').value=x.u;$('sk').value=x.k;$('sm').value=x.m;$('sa').value=x.a==null?'':x.a;$('sb').textContent='Save changes';$('sx').classList.remove('hide');$('sht').textContent='Edit sale';openSheet('s')};
window.editE=id=>{const x=S.e[id];if(!x)return;eE=id;$('ed').value=x.d;$('ec').value=x.c;$('ex').value=x.n;$('ea').value=x.a;$('eb').textContent='Save changes';$('ex2').classList.remove('hide');$('eht').textContent='Edit expense';openSheet('e')};
$('sx').onclick=()=>{resetS();closeSheets()};$('ex2').onclick=()=>{resetE();closeSheets()};
['shs','she'].forEach(i=>$(i).onclick=e=>{if(e.target.id==i){resetS();resetE();closeSheets()}});
$('fab').onclick=()=>{if(cur=='exp'){resetE();openSheet('e')}else{resetS();openSheet('s')}};
$('fs').onsubmit=e=>{e.preventDefault();const a=$('sa').value,old=eS&&S.s[eS];
 const o={id:eS||uid(),d:$('sd').value,p:$('sp').value.trim(),q:+$('sq').value,u:+$('su').value,k:+$('sk').value||0,m:$('sm').value,a:a===''?null:+a,by:old?old.by:me};
 yr=+o.d.slice(0,4);if(o.p&&!L('p').some(p=>p.name==o.p))add('p',{id:uid(),name:o.p});resetS();closeSheets();put('s',o)};
$('fp').onsubmit=e=>{e.preventDefault();const n=$('np').value.trim();if(n&&!L('p').some(p=>p.name==n))put('p',{id:uid(),name:n});$('np').value=''};
window.delP=id=>del('p',id);
$('fe').onsubmit=e=>{e.preventDefault();const old=eE&&S.e[eE];
 const o={id:eE||uid(),d:$('ed').value,c:$('ec').value,n:$('ex').value.trim(),a:+$('ea').value,by:old?old.by:me};
 yr=+o.d.slice(0,4);resetE();closeSheets();put('e',o)};
$('yr').onchange=e=>{yr=+e.target.value;render()};
$('nav').onclick=e=>{const bt=e.target.closest('button');if(!bt)return;const k=bt.dataset.t;document.querySelectorAll('section').forEach(s=>s.classList.toggle('hide',s.id!=k));[...$('nav').children].forEach(x=>x.classList.toggle('on',x==bt));cur=k;$('fab').classList.toggle('hide',k=='set');window.scrollTo(0,0)};

$('rst').onclick=()=>{if(confirm('Erase ALL sales and expenses for everyone in this shop? This cannot be undone.')){['s','e'].forEach(k=>Object.keys(S[k]).forEach(i=>{delete S[k][i];queue(k,i,'del')}));commit()}};
async function dl(name,data,type){
 try{const d=window.claude&&await window.claude.use('downloads');if(d){await d.save({filename:name,data});return}}catch(e){}
 try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove()}catch(e){alert('Downloads are not available in this view.')}}
const csv=(name,head,rows)=>{const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';return dl(name,[head,...rows].map(r=>r.map(q).join(',')).join('\n'),'text/csv')};
$('exs').onclick=()=>csv('sales.csv',['Date','Product','Qty','Unit price','Unit cost','Total','Profit','Via','Paid','Balance','Recorded by'],L('s').sort((a,b)=>a.d.localeCompare(b.d)).map(x=>[x.d,x.p,x.q,x.u,x.k,tot(x),prof(x),x.m,paid(x),bal(x),who(x)]));
$('exe').onclick=()=>csv('expenses.csv',['Date','Category','Description','Amount','Recorded by'],L('e').sort((a,b)=>a.d.localeCompare(b.d)).map(x=>[x.d,x.c,x.n,x.a,who(x)]));
$('bk').onclick=()=>dl('sales-tracker-backup-'+today()+'.json',JSON.stringify({sales:L('s'),exp:L('e')}),'application/json');
$('rs').onclick=()=>$('rf').click();
$('rf').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const j=JSON.parse(await f.text());const ss=Array.isArray(j.sales)?j.sales:Object.values(j.sales||{}),xs=Array.isArray(j.exp)?j.exp:Object.values(j.exp||{});
 if(!ss.length&&!xs.length)throw 0;if(confirm(`Add ${ss.length} sales and ${xs.length} expenses from this backup? Existing records are kept.`)){ss.forEach(x=>{x.id=x.id||uid();x.by=x.by||me;add('s',x)});xs.forEach(x=>{x.id=x.id||uid();x.by=x.by||me;add('e',x)});commit()}}catch(x){alert('That file is not a valid backup.')}e.target.value=''};
// ---- start
$('sd').value=$('ed').value=today();document.body.append($('shs'),$('she'));
try{const l=localStorage.getItem(KEY);if(l)S=Object.assign(fresh(),JSON.parse(l))}catch(e){}
render();
addEventListener('online',()=>{afterAuth()});addEventListener('offline',status_);setInterval(()=>{if(S.shop)flush()},20000);
if(window.supabase&&CFG.SUPABASE_URL&&CFG.SUPABASE_ANON_KEY){try{
 sb=supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
 sb.auth.onAuthStateChange((ev,s)=>{sess=s;me=s&&s.user?s.user.id:null;
  if(ev=='PASSWORD_RECOVERY')setTimeout(async()=>{const p=prompt('Type your new password (6+ characters):');if(p){const r=await sb.auth.updateUser({password:p});alert(r.error?r.error.message:'Password updated.')}},0);
  setTimeout(()=>{status_();if(s)afterAuth()},0)});
 sb.auth.getSession().then(({data})=>{if(data.session){sess=data.session;me=sess.user.id}status_();if(sess)afterAuth()})}catch(e){sb=null}}
status_();

if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
